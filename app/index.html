<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover — GTA-style Poster Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>VICE COVER</h1>
      <p class="tag">A GTA-style poster maker. Your photos, your words — no official art, no logos.</p>
    </header>

    <fieldset>
      <legend>Layout</legend>
      <div id="layouts" class="chips"></div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div id="grades" class="chips"></div>
    </fieldset>

    <fieldset>
      <legend id="panelLabel">Panel 1 of 4</legend>
      <div class="row">
        <button id="samplePier" type="button">Pier sample</button>
        <button id="sampleBoulevard" type="button">Boulevard sample</button>
      </div>
      <label class="file">Upload photo <input id="photo" type="file" accept="image/*"></label>
      <p class="hint">Click a panel to select it, drag it to reposition, or drop a photo on the cover.</p>
      <label>Zoom <span id="zoomVal">100%</span>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Vice City • 2026"></label>
      <div class="row">
        <label>Font
          <select id="font">
            <option value="anton" selected>Anton (condensed)</option>
            <option value="bebas">Bebas Neue</option>
            <option value="system">System condensed</option>
          </select>
        </label>
        <label>Position
          <select id="titlePos">
            <option value="bottom" selected>Bottom</option>
            <option value="center">Center</option>
            <option value="top">Top</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Size <span id="titleSizeVal">100%</span>
          <input id="titleSize" type="range" min="0.6" max="1.6" step="0.05" value="1">
        </label>
        <label>Colour <input id="titleColor" type="color" value="#ffffff"></label>
      </div>
      <div class="checks">
        <label><input id="gradient" type="checkbox" checked> Gradient fill</label>
        <label><input id="outline" type="checkbox" checked> Outline</label>
        <label><input id="shadow" type="checkbox" checked> Shadow</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Polish</legend>
      <label>Badge text <input id="badgeText" type="text" maxlength="30" value="Vice City • 2026"></label>
      <div class="checks">
        <label><input id="badge" type="checkbox" checked> Badge ribbon</label>
        <label><input id="grain" type="checkbox" checked> Film grain</label>
        <label><input id="vignette" type="checkbox" checked> Vignette</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export PNG</legend>
      <div class="row wrap">
        <button id="exportSquare" type="button">1080 × 1080</button>
        <button id="exportPortrait" type="button">1080 × 1350</button>
        <button id="exportWide" type="button">1920 × 1080</button>
      </div>
      <button id="exportAll" type="button" class="primary">Export all three</button>
      <button id="reset" type="button" class="ghost">Reset panels</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
    <p class="stage-hint">Live preview — drag panels, switch layouts, export when it looks right.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
